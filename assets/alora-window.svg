<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 268" fill="none">
  <!-- Locked ALORA window mascot: Ixtapa from inside the unit -->
  <defs>
    <clipPath id="arch">
      <path d="M28 214 V96 A82 82 0 0 1 192 96 V214 Z"/>
    </clipPath>
  </defs>
  <g clip-path="url(#arch)">
    <path d="M28 214 V96 A82 82 0 0 1 192 96 V214 Z" fill="#F4EDE4"/>
    <!-- coral sun, upper right -->
    <circle cx="148" cy="78" r="24" fill="#E07A5F"/>
    <!-- back mountain (charcoal, larger, right) -->
    <polygon points="88,214 158,92 210,214" fill="#2C2C2C"/>
    <!-- front mountain (sand tan) -->
    <polygon points="18,214 86,128 168,214" fill="#C4A882"/>
    <!-- one palm, left, trunk leans in -->
    <g stroke="#2C2C2C" fill="none" stroke-linecap="round">
      <path d="M58 214 L72 132" stroke-width="4"/>
      <path d="M72 134 C58 128 46 118 40 104" stroke-width="3"/>
      <path d="M72 132 C62 118 58 104 60 90" stroke-width="3"/>
      <path d="M72 132 C78 116 86 104 98 94" stroke-width="3"/>
      <path d="M72 134 C84 128 96 124 108 122" stroke-width="3"/>
      <path d="M72 130 C68 114 72 100 80 88" stroke-width="3"/>
    </g>
  </g>
  <!-- thin arch frame -->
  <path d="M28 214 V96 A82 82 0 0 1 192 96 V214" stroke="#2C2C2C" stroke-width="5" stroke-linecap="round"/>
  <!-- thick sill -->
  <rect x="16" y="210" width="188" height="16" rx="2" fill="#2C2C2C"/>
  <!-- skeleton key on the sill -->
  <g transform="translate(88 212)" fill="none" stroke="#F4EDE4" stroke-width="2.2" stroke-linecap="round">
    <circle cx="10" cy="6" r="5.5"/>
    <path d="M15.5 6 H36"/>
    <path d="M30 6 V12"/>
    <path d="M35 6 V10"/>
  </g>
</svg>
